<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog - Lana Ramos</title>
    <script src="../components/custom-footer.js"></script>
  </head>
  <body>
    <a href="../">Regresar</a>
    <h1>Blog</h1>
    <main id="container">
      <!-- Estado de carga -->
      <p>Cargando...</p>
    </main>
    <custom-footer></custom-footer>
    <script>
      const container = document.getElementById("container");

      async function render() {
        const res = await fetch("./index.json");

        // Estado de error
        if (!res.ok) {
          container.innerHTML =
            "Ocurrión un error al consultar las publicaciones.";
          return;
        }

        const data = await res.json();

        container.innerHTML = data.length
          ? // Estado lleno (completado con datos)
            `<ul>${data

              .reverse()
              .map(({ title, id }) => {
                const [year, month, date] = id
                  .substring(0, 10)
                  .split("-")
                  .map((i) => Number(i));

                return `<li><a href="./publicaciones/#/${id}">${title}</a> - ${new Date(
                  year,
                  month - 1,
                  date
                ).toLocaleString("es-MX", { dateStyle: "full" })}</li>`;
              })
              .join("")}</ul`
          : // Estado vacío (completado sin datos)
            "No hay publicaciones para mostrar.";
      }

      render();
    </script>
  </body>
</html>
