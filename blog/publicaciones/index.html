<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog - Lana Ramos</title>
    <script src="../../components/custom-footer.js"></script>
  </head>
  <body>
    <a href="../">Regresar</a>
    <div id="content"></div>
    <custom-footer></custom-footer>
    <script type="module">
      import { marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";
      const content = document.getElementById("content");
      async function render() {
        //Estado de carga
        content.innerHTML = "Cargando...";
        const post = location.hash.substring(2);
        const res = await fetch(`./${post}.md`);

        //Estado de Error
        if (!res.ok) {
          content.innerHTML =
            res.status === 404
              ? "No existe la publicación."
              : "Ocurrió un error.";
          return;
        }
        //Estado chido
        const data = await res.text();
        content.innerHTML = marked.parse(data);
      }
      window.onhashchange = render;
      render();
    </script>
  </body>
</html>
